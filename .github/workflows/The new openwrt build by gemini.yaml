name: The newest openwrt x86_64 for N5105

on:
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build new firmware anyway"
        required: true
        default: "true"

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  CONFIG_FILE: example.config
  CUSTOM_SCRIPT_1: script1.sh
  CUSTOM_SCRIPT_2: script2.sh
  STORE_PRODUCTS: false
  STORE_FIRMWARE: true
  RELEASE_FIRMWARE: false
  TIME_ZONE: Asia/Shanghai

jobs:
  check:
    name: Get latest stable version
    runs-on: ubuntu-latest
    outputs:
      stable_tag: ${{ steps.get-version.outputs.stable_tag }}
      repo_branch: ${{ steps.get-version.outputs.repo_branch }}
      new_version: ${{ steps.check-cache.outputs.new_version }}
    steps:
      - name: Get latest stable version
        id: get-version
        run: |
          STABLE_VERSION=$(curl -s https://downloads.openwrt.org/releases/ | \
                            grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | \
                            cut -d'"' -f2 | tr -d '/' | sort -Vu | tail -n1)
          [ -z "$STABLE_VERSION" ] && echo "Error: Failed to get version" && exit 1
          echo "Latest stable version: $STABLE_VERSION"
          echo "stable_tag=v$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "repo_branch=openwrt-$(echo "$STABLE_VERSION" | cut -d '.' -f1,2)" >> $GITHUB_OUTPUT
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_ENV

      - name: Check if new version
        id: check-cache
        uses: actions/cache@v5
        with:
          path: .version-cache
          key: version-${{ env.stable_version }}

      - name: Save new version
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .version-cache
          echo "${{ env.stable_version }}" > .version-cache/version
          echo "new_version=true" >> $GITHUB_OUTPUT

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: check
    # 仅在新版本或强制构建时执行
    if: (needs.check.outputs.new_version == 'true') || (github.event.inputs.force-build == 'true')
    permissions:
      contents: write
    env:
      STABLE_TAG: ${{ needs.check.outputs.stable_tag }}
      REPO_BRANCH: ${{ needs.check.outputs.repo_branch }}
      BARK_KEY: ${{ secrets.BARK_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "DEVICE_NAME=_N5105" >> $GITHUB_ENV
          
          sudo apt-get -qq update
          sudo apt-get -qq install binutils bison build-essential bzip2 cmake cpio curl flex gawk git gperf haveged libelf-dev libssl-dev libtool ninja-build p7zip p7zip-full patch pkgconf python3 python3-setuptools qemu-utils rsync squashfs-tools subversion unzip vim wget xxd zlib1g-dev aria2 autoconf automake autopoint device-tree-compiler gettext libncurses5-dev libncursesw5-dev libreadline-dev libpython3-dev libfuse-dev libglib2.0-dev libmpc-dev libmpfr-dev libgmp3-dev libltdl-dev intltool help2man mkisofs msmtp lrzsz scons texinfo clang file gcc-multilib g++-multilib
          sudo apt-get -qq autoremove --purge && sudo apt-get -qq clean
          sudo timedatectl set-timezone $TIME_ZONE
          sudo mkdir -p /workdir/ && sudo chown $USER:$USER /workdir/

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone --depth 1 --branch $STABLE_TAG --single-branch $REPO_URL openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          cp -r $GITHUB_WORKSPACE/files /workdir/openwrt/ || true

      - name: Run custom-script-1 & Update feeds
        working-directory: /workdir/openwrt
        run: |
          [ -f $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_1 ] && chmod +x $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_1 && $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_1
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Fix base-files version
        working-directory: /workdir/openwrt
        run: |
          set -e
          VERSION=${STABLE_TAG#v}
          echo "Detected OpenWrt version: $VERSION"

          BASE_URL="https://downloads.openwrt.org/releases/$VERSION"
          PATHS=("targets/x86/64/packages" "packages/x86_64/base")
          PKG_RELEASE=""

          for p in "${PATHS[@]}"; do
            echo "Trying path: $p"
            # 1. 优先尝试解析 Packages 文件
            PKG_RELEASE=$(curl -s "$BASE_URL/$p/Packages" | awk '/^Package: base-files/{f=1} f && /^Version:/{print $2; exit}')
            [ -n "$PKG_RELEASE" ] && echo "Extracted from Packages: $PKG_RELEASE" && break
            
            # 2. 如果 Packages 无效，尝试从目录列表获取 (增加 head -1 防止多次匹配导致的多行问题)
            PKG_RELEASE=$(curl -s "$BASE_URL/$p/" | grep -oE 'base-files-[^"]*\.(ipk|apk)' | head -1 | sed -E 's/base-files-(.+)\.[^.]+/\1/')
            [ -n "$PKG_RELEASE" ] && echo "Extracted from directory: $PKG_RELEASE" && break
          done

          # 安全机制：彻底清除变量中可能包含的回车、换行和多余空格
          PKG_RELEASE=$(echo "$PKG_RELEASE" | tr -d ' \n\r')

          # 错误处理
          [ -z "$PKG_RELEASE" ] && { echo "ERROR: Failed to detect PKG_RELEASE."; exit 1; }

          MAKE_FILE="package/base-files/Makefile"
          [ ! -f "$MAKE_FILE" ] && { echo "ERROR: $MAKE_FILE not found!"; exit 1; }

          # 修改 Makefile
          if grep -q "^PKG_RELEASE:=" "$MAKE_FILE"; then
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$PKG_RELEASE/" "$MAKE_FILE"
          else
            sed -i "/^PKG_VERSION:=/a PKG_RELEASE:=$PKG_RELEASE" "$MAKE_FILE"
          fi
          
          echo "Updated $MAKE_FILE with PKG_RELEASE:=$PKG_RELEASE"

      - name: Apply base config
        working-directory: /workdir/openwrt
        run: |
          [ -f $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          make defconfig

      - name: Run custom-script-2 (append custom packages)
        working-directory: /workdir/openwrt
        run: |
          [ -f $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_2 ] && chmod +x $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_2 && $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_2
          # script2.sh 会追加自定义包，并执行 make oldconfig
          # 注意：script2.sh 内部不应再执行 make defconfig

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: github.event.inputs.ssh == 'true'
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Download packages
        working-directory: /workdir/openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        working-directory: /workdir/openwrt
        id: compile
        run: |
          set +e
          make -j$(nproc) || make -j1 || make -j1 V=s
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          exit $BUILD_STATUS

      - name: Organize firmware-related files
        working-directory: /workdir/openwrt
        id: organize-files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/*/*
          rm -rf packages *.swap swapfile *.log
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware directory
        uses: actions/upload-artifact@v5
        if: env.STORE_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag & Upload
        if: env.RELEASE_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FILE_DATE }}
          body: |
            # Build Info
            - Source: ${{ env.REPO_URL }} tag:${{ env.STABLE_TAG }}
          files: ${{ env.FIRMWARE }}/*

      - name: Send Bark Notification (POST)
        if: always() && env.BARK_KEY != ''
        run: |
          if [ "${{ steps.compile.outputs.status }}" == "success" ]; then
            TITLE="OpenWRT 编译完成"
            BODY="新版本已编译成功。\n版本: $STABLE_TAG\n分支: $REPO_BRANCH"
          else
            TITLE="OpenWRT 编译失败"
            BODY="编译过程出现问题，请检查 GitHub Actions 日志。"
          fi
          
          curl -s -X POST "https://bark.free.svipss.top/$BARK_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"title\": \"$TITLE\", \"body\": \"$BODY\", \"group\": \"OpenWRT 编译\"}" || true

  clean:
    name: Clean up old assets
    runs-on: ubuntu-latest
    needs: build
    if: always()   # 即使 build 被跳过也运行
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 1

      - name: Remove old Releases
        if: env.RELEASE_FIRMWARE == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: repo.owner, repo: repo.repo, per_page: 100
            });
            const valid = releases.filter(r => !r.draft && !r.prerelease)
              .sort((a,b) => new Date(b.published_at) - new Date(a.published_at));
            const delList = valid.slice(3);
            for (const r of delList) {
              await github.rest.repos.deleteRelease({owner:repo.owner,repo:repo.repo,release_id:r.id});
              await github.rest.git.deleteRef({owner:repo.owner,repo:repo.repo,ref:`tags/${r.tag_name}`});
              console.log(`Removed: ${r.tag_name}`);
            }