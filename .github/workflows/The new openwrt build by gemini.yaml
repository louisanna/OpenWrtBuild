name: The newest openwrt x86_64 for N5105
on:
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build new firmware anyway"
        required: true
        default: "true"

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  CONFIG_FILE: example.config
  CUSTOM_SCRIPT_1: script1.sh
  CUSTOM_SCRIPT_2: script2.sh
  STORE_PRODUCTS: false
  STORE_FIRMWARE: true
  RELEASE_FIRMWARE: false
  TIME_ZONE: Asia/Shanghai

jobs:
  check:
    name: Check for new stable release
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      stable_tag: ${{ steps.get-version.outputs.stable_tag }}
      repo_branch: ${{ steps.get-version.outputs.repo_branch }}

    steps:
      - name: Get latest stable version
        id: get-version
        run: |
          STABLE_VERSION=$(curl -s https://downloads.openwrt.org/releases/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | cut -d'"' -f2 | tr -d '/' | sort -Vu | tail -n1)
          [ -z "$STABLE_VERSION" ] && echo "Error: Failed to get version" && exit 1
          echo "Latest stable version: $STABLE_VERSION"
          
          echo "stable_tag=v$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "repo_branch=openwrt-$(echo "$STABLE_VERSION" | cut -d '.' -f1,2)" >> $GITHUB_OUTPUT

      - name: Cache check by tag
        id: cache
        uses: actions/cache@v5
        with:
          path: .tag-cache
          key: TAG-${{ steps.get-version.outputs.stable_tag }}

      - name: Save new tag
        if: steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p .tag-cache && echo "${{ steps.get-version.outputs.stable_tag }}" > .tag-cache/tag

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.cache-hit != 'true' || github.event.inputs.force-build == 'true'
    permissions:
      contents: write
    env:
      STABLE_TAG: ${{ needs.check.outputs.stable_tag }}
      REPO_BRANCH: ${{ needs.check.outputs.repo_branch }}
      BARK_KEY: ${{ secrets.BARK_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install binutils bison build-essential bzip2 ccache cmake cpio curl flex gawk git gperf haveged libelf-dev libssl-dev libtool ninja-build p7zip p7zip-full patch pkgconf python3 python3-setuptools qemu-utils rsync squashfs-tools subversion unzip vim wget xxd zlib1g-dev aria2 autoconf automake autopoint device-tree-compiler gettext libncurses5-dev libncursesw5-dev libreadline-dev libpython3-dev libfuse-dev libglib2.0-dev libmpc-dev libmpfr-dev libgmp3-dev libltdl-dev intltool help2man mkisofs msmtp lrzsz scons texinfo clang file gcc-multilib g++-multilib
          sudo apt-get -qq autoremove --purge && sudo apt-get -qq clean
          sudo timedatectl set-timezone $TIME_ZONE
          sudo mkdir -p /workdir/ && sudo chown $USER:$USER /workdir/

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone --depth 1 --branch $STABLE_TAG --single-branch $REPO_URL openwrt/
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          cp -r $GITHUB_WORKSPACE/files $GITHUB_WORKSPACE/openwrt/ || true

      - name: Cache OpenWrt dl directory
        uses: actions/cache@v5
        with:
          path: /workdir/openwrt/dl
          key: openwrt-dl-${{ env.REPO_BRANCH }}-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ env.REPO_BRANCH }}-
            openwrt-dl-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /workdir/openwrt/.ccache
          key: openwrt-ccache-${{ env.REPO_BRANCH }}-${{ hashFiles('**/config*') }}
          restore-keys: |
            openwrt-ccache-${{ env.REPO_BRANCH }}-
            openwrt-ccache-
      - name: Run scripts & Update feeds
        working-directory: /workdir/openwrt
        run: |
          chmod +x $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_1 && $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_1
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Fix base-files version
        working-directory: /workdir/openwrt
        run: |
          VERSION=$(echo "$STABLE_TAG" | sed 's/^v//')
          echo "Detected OpenWrt version: $VERSION"
          
          PKG_RELEASE=$(curl -s "https://downloads.openwrt.org/releases/$VERSION/targets/x86/64/packages/Packages" | grep -A 5 '^Package: base-files$' | grep '^Version:' | head -1 | sed -r 's/.*Version: ([0-9]+).*/\1/')
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE=$(curl -s "https://downloads.openwrt.org/releases/$VERSION/packages/x86_64/base/Packages" | grep -A 5 '^Package: base-files$' | grep '^Version:' | head -1 | sed -r 's/.*Version: ([0-9]+).*/\1/')
          
          if [ -n "$PKG_RELEASE" ]; then
            MAKE_FILE="package/base-files/Makefile"
            if grep -q "^PKG_RELEASE:=" "$MAKE_FILE"; then
              sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$PKG_RELEASE/" "$MAKE_FILE"
            else
              sed -i "/^PKG_VERSION:=/a PKG_RELEASE:=$PKG_RELEASE" "$MAKE_FILE"
            fi
            echo "Successfully fixed PKG_RELEASE to $PKG_RELEASE"
          else
            echo "WARNING: Failed to detect PKG_RELEASE. Skipping and using source default."
          fi

      - name: Run custom-script-2
        working-directory: /workdir/openwrt
        run: chmod +x $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_2 && $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_2

      - name: Enable ccache & Apply config
        working-directory: /workdir/openwrt
        run: |
          make defconfig
          sed -i 's/# CONFIG_CCACHE is not set/CONFIG_CCACHE=y/g' .config || echo "CONFIG_CCACHE=y" >> .config
          echo "export CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: github.event.inputs.ssh == 'true'
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Download packages
        working-directory: /workdir/openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        working-directory: /workdir/openwrt
        id: compile
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s
          
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Organize firmware-related files
        id: organize-files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages *.swap swapfile *.log
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware directory
        uses: actions/upload-artifact@v5
        if: env.STORE_FIRMWARE == 'true'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag & Upload
        if: env.RELEASE_FIRMWARE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FILE_DATE }}
          body: |
            # Build Info
            - Source: ${{ env.REPO_URL }} tag:${{ env.STABLE_TAG }}
          files: ${{ env.FIRMWARE }}/*

      - name: Send Bark Notification (POST)
        if: always() && env.BARK_KEY != ''
        run: |
          if [ "${{ steps.compile.outputs.status }}" == "success" ]; then
            TITLE="OpenWRT 编译完成"
            BODY="新版本已编译成功。\n版本: $STABLE_TAG\n分支: $REPO_BRANCH"
          else
            TITLE="OpenWRT 编译失败"
            BODY="编译过程出现问题，请检查 GitHub Actions 日志。"
          fi
          
          curl -s -X POST "https://bark.free.svipss.top/$BARK_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"title\": \"$TITLE\", \"body\": \"$BODY\", \"group\": \"OpenWRT\"}" || true

  clean:
    name: Clean up old assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 1

      - name: Remove old Releases
        if: env.RELEASE_FIRMWARE == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: repo.owner, repo: repo.repo, per_page: 100
            });
            const valid = releases.filter(r => !r.draft && !r.prerelease)
              .sort((a,b) => new Date(b.published_at) - new Date(a.published_at));
            const delList = valid.slice(3);
            for (const r of delList) {
              await github.rest.repos.deleteRelease({owner:repo.owner,repo:repo.repo,release_id:r.id});
              await github.rest.git.deleteRef({owner:repo.owner,repo:repo.repo,ref:`tags/${r.tag_name}`});
              console.log(`Removed: ${r.tag_name}`);
            }
