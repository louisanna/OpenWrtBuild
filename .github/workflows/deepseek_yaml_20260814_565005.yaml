name: The newest openwrt x86_64 latest

on:
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build new firmware anyway"
        required: true
        default: "true"
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00，北京时间 3:00

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  CONFIG_FILE: example.config
  CUSTOM_SCRIPT_2: script2.sh
  STORE_PRODUCTS: false
  STORE_FIRMWARE: true
  RELEASE_FIRMWARE: false
  TIME_ZONE: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BARK_KEY: ${{ secrets.BARK_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      # ---------- 检测系统版本更新 ----------
      - name: Get latest stable version
        id: version
        run: |
          STABLE_VERSION=$(curl -s https://downloads.openwrt.org/releases/ | \
            grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | \
            cut -d'"' -f2 | tr -d '/' | sort -Vu | tail -n1)
          [ -z "$STABLE_VERSION" ] && exit 1
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "stable_tag=v$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "repo_branch=openwrt-$(echo "$STABLE_VERSION" | cut -d '.' -f1,2)" >> $GITHUB_OUTPUT

      - name: Check version cache
        id: version-cache
        uses: actions/cache@v4
        with:
          path: .version-cache
          key: version-${{ steps.version.outputs.stable_version }}

      - name: Determine version update
        id: version-status
        run: |
          if [ "${{ steps.version-cache.outputs.cache-hit }}" == "true" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            mkdir -p .version-cache
            echo "${{ steps.version.outputs.stable_version }}" > .version-cache/version
          fi

      # ---------- 检测 feeds 更新 ----------
      - name: Clone source code
        run: |
          git clone --depth 1 --branch "${{ steps.version.outputs.stable_tag }}" --single-branch "$REPO_URL" openwrt
          cp -r files openwrt/ || true

      - name: Update feeds
        working-directory: openwrt
        run: |
          VERSION="${{ steps.version.outputs.stable_version }}"
          curl -fsSL "https://downloads.openwrt.org/releases/$VERSION/packages/x86_64/feeds.conf" -o feeds.conf
          if [ ! -s feeds.conf ]; then
            echo "Error: feeds.conf download failed or empty"
            exit 1
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compute feeds hash
        id: feeds-hash
        working-directory: openwrt
        run: |
          FEEDS_HASH=$(for d in feeds/*/.git; do
            git -C "$(dirname "$d")" rev-parse HEAD 2>/dev/null || true
          done | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$FEEDS_HASH" >> $GITHUB_OUTPUT
          echo "key=feeds-$FEEDS_HASH" >> $GITHUB_OUTPUT

      - name: Check feeds cache
        id: feeds-cache
        uses: actions/cache@v4
        with:
          path: .feeds-cache
          key: ${{ steps.feeds-hash.outputs.key }}

      - name: Determine feeds update
        id: feeds-status
        run: |
          if [ "${{ steps.feeds-cache.outputs.cache-hit }}" == "true" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            mkdir -p .feeds-cache
            echo "${{ steps.feeds-hash.outputs.hash }}" > .feeds-cache/hash
          fi

      # ---------- 决定是否构建 ----------
      - name: Decide whether to build
        id: should-build
        run: |
          FORCE_BUILD="${{ github.event.inputs.force-build }}"
          VERSION_UPDATED="${{ steps.version-status.outputs.updated }}"
          FEEDS_UPDATED="${{ steps.feeds-status.outputs.updated }}"
          if [ "$FORCE_BUILD" == "true" ] || [ "$VERSION_UPDATED" == "true" ] || [ "$FEEDS_UPDATED" == "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      # 无更新时发送通知（可选）
      - name: Send skip notification
        if: steps.should-build.outputs.build == 'false' && env.BARK_KEY != ''
        run: |
          curl -s -X POST "https://bark.free.svipss.top/$BARK_KEY" \
            -H "Content-Type: application/json" \
            -d '{"title": "OpenWRT 无更新", "body": "系统版本和 feeds 均无更新，跳过编译", "group": "OpenWRT 编译"}' || true

      # ---------- 以下步骤仅在 should-build.build == 'true' 时执行 ----------
      - name: Install dependencies
        if: steps.should-build.outputs.build == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "DEVICE_NAME=_N5105" >> $GITHUB_ENV
          
          sudo apt-get -qq update
          sudo apt-get -qq install binutils bison build-essential bzip2 cmake cpio curl flex gawk git gperf haveged libelf-dev libssl-dev libtool ninja-build p7zip p7zip-full patch pkgconf python3 python3-setuptools qemu-utils rsync squashfs-tools subversion unzip vim wget xxd zlib1g-dev aria2 autoconf automake autopoint device-tree-compiler gettext libncurses5-dev libncursesw5-dev libreadline-dev libpython3-dev libfuse-dev libglib2.0-dev libmpc-dev libmpfr-dev libgmp3-dev libltdl-dev intltool help2man mkisofs msmtp lrzsz scons texinfo clang file gcc-multilib g++-multilib
          sudo apt-get -qq autoremove --purge && sudo apt-get -qq clean
          sudo timedatectl set-timezone $TIME_ZONE
          sudo mkdir -p /workdir/ && sudo chown $USER:$USER /workdir/
          
      - name: Cache toolchain
        id: cache-toolchain
        if: steps.should-build.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/staging_dir/toolchain-*
          key: toolchain-${{ steps.version.outputs.repo_branch }}-x86_64
          restore-keys: |
            toolchain-${{ steps.version.outputs.repo_branch }}-x86_64
            toolchain-

      - name: Build toolchain (if not cached)
        if: steps.should-build.outputs.build == 'true' && steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: openwrt
        run: |
          export TERM=linux
          echo "Toolchain cache miss, building now..."
          make toolchain/compile -j$(nproc)

      - name: Download packages
        if: steps.should-build.outputs.build == 'true'
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Fix base-files version
        working-directory: /workdir/openwrt
        run: |
          set -e
          VERSION=${STABLE_TAG#v}
          echo "Detected OpenWrt version: $VERSION"

          BASE_URL="https://downloads.openwrt.org/releases/$VERSION"
          PATHS=("targets/x86/64/packages" "packages/x86_64/base")
          PKG_RELEASE=""

          for p in "${PATHS[@]}"; do
            echo "Trying path: $p"
            PKG_RELEASE=$(curl -s "$BASE_URL/$p/Packages" | awk '/^Package: base-files/{f=1} f && /^Version:/{print $2; exit}')
            if [ -n "$PKG_RELEASE" ]; then
              PKG_RELEASE=$(echo "$PKG_RELEASE" | grep -oE '^[0-9]+')
              [ -n "$PKG_RELEASE" ] && echo "Extracted from Packages: $PKG_RELEASE" && break
            fi
            PKG_RELEASE=$(curl -s "$BASE_URL/$p/" | grep -oE 'base-files-[^"]*\.(ipk|apk)' | head -1 | sed -E 's/base-files-(.+)\.[^.]+/\1/')
            if [ -n "$PKG_RELEASE" ]; then
              PKG_RELEASE=$(echo "$PKG_RELEASE" | grep -oE '^[0-9]+')
              [ -n "$PKG_RELEASE" ] && echo "Extracted from directory: $PKG_RELEASE" && break
            fi
          done

          PKG_RELEASE=$(echo "$PKG_RELEASE" | tr -d ' \n\r')
          [ -z "$PKG_RELEASE" ] && { echo "ERROR: Failed to detect PKG_RELEASE."; exit 1; }

          MAKE_FILE="package/base-files/Makefile"
          [ ! -f "$MAKE_FILE" ] && { echo "ERROR: $MAKE_FILE not found!"; exit 1; }

          if grep -q "^PKG_RELEASE:=" "$MAKE_FILE"; then
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$PKG_RELEASE/" "$MAKE_FILE"
          else
            sed -i "/^PKG_VERSION:=/a PKG_RELEASE:=$PKG_RELEASE" "$MAKE_FILE"
          fi
          echo "Updated $MAKE_FILE with PKG_RELEASE:=$PKG_RELEASE"

      - name: Add Full Cone NAT patches
        working-directory: /workdir/openwrt
        run: |
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash
          #sed -i '1iPKG_FIXUP:=autoreconf' package/libs/libnftnl/Makefile
          yes "" | make oldconfig V=s


      - name: Compile firmware
        id: compile
        if: steps.should-build.outputs.build == 'true'
        working-directory: openwrt
        run: |
          if make -j$(nproc) V=s; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Organize firmware files
        if: steps.should-build.outputs.build == 'true' && steps.compile.outputs.status == 'success'
        working-directory: openwrt
        run: |
          cd bin/targets/*/*
          rm -rf packages *.swap swapfile *.log
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware artifact
        if: steps.should-build.outputs.build == 'true' && steps.compile.outputs.status == 'success' && env.STORE_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release
        if: steps.should-build.outputs.build == 'true' && steps.compile.outputs.status == 'success' && env.RELEASE_FIRMWARE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FILE_DATE }}
          files: ${{ env.FIRMWARE }}/*

      # ---------- Bark 通知 ----------
      - name: Send Bark notification
        if: always() && steps.should-build.outputs.build == 'true' && env.BARK_KEY != ''
        run: |
          # 缓存状态
          if [ "${{ steps.cache-toolchain.outputs.cache-hit }}" == "true" ]; then
            CACHE_STATUS="复用缓存"
          else
            CACHE_STATUS="新建缓存"
          fi
          # feeds 更新状态
          if [ "${{ steps.feeds-status.outputs.updated }}" == "true" ]; then
            FEEDS_STATUS="有更新"
          else
            FEEDS_STATUS="无更新"
          fi
          # 版本更新状态
          if [ "${{ steps.version-status.outputs.updated }}" == "true" ]; then
            VERSION_STATUS="有更新"
          else
            VERSION_STATUS="无更新"
          fi

          if [ "${{ steps.compile.outputs.status }}" == "success" ]; then
            TITLE="OpenWRT 编译完成"
            BODY="版本: ${{ steps.version.outputs.stable_tag }}\n分支: ${{ steps.version.outputs.repo_branch }}\n版本状态: $VERSION_STATUS\nFeeds状态: $FEEDS_STATUS\nToolchain缓存: $CACHE_STATUS"
          else
            TITLE="OpenWRT 编译失败"
            BODY="编译失败，请检查日志。\n版本状态: $VERSION_STATUS\nFeeds状态: $FEEDS_STATUS\nToolchain缓存: $CACHE_STATUS"
          fi
          curl -s -X POST "https://bark.free.svipss.top/$BARK_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"title\": \"$TITLE\", \"body\": \"$BODY\", \"group\": \"OpenWRT 编译\"}" || true
